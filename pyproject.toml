[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahakari-guard"
version = "0.1.0"
description = "Watch-only fraud watchdog, privacy shield and 6-hour cyber-incident reporting kit for India's co-operative banks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sahakari-Guard team" }]
keywords = ["cybersecurity", "banking", "reconciliation", "fraud-detection", "dpdp", "rbi", "cooperative-banks"]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sahakari-guard = "sahakari_guard.cli:main"

[tool.setuptools.packages.find]
include = ["sahakari_guard*"]

[tool.setuptools.package-data]
sahakari_guard = ["i18n/*.json", "reports/templates/*.html", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
